<!DOCTYPE html> 

<html lang="vi"> 

<head> 

<meta charset="utf-8"> 

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"> 

<title>SmartTutor – Trợ giảng số thông minh</title> 

<link rel="preconnect" href="https://fonts.googleapis.com"> 

<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;700;800&display=swap" rel="stylesheet"> 

<style> 

:root{--bg:#f6f4ee;--card:#fff;--ink:#14263a;--mute:#5d6b7a;--line:#d9d6cb;--brand:#0e6b5c;--brand-ink:#fff;--hi:#ffe26a;--ok:#14803c;--bad:#b42318;--okbg:#e4f5ea;--badbg:#fde8e6; 

box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)} 

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1a24;--card:#17252f;--ink:#e8eef3;--mute:#9fb0be;--line:#2c3e4b;--brand:#3fc1a8;--brand-ink:#06201b;--hi:#c9a800;--ok:#6ee09a;--bad:#ff9a8f;--okbg:#12361f;--badbg:#3d1b18}} 

:root[data-theme="dark"]{--bg:#0f1a24;--card:#17252f;--ink:#e8eef3;--mute:#9fb0be;--line:#2c3e4b;--brand:#3fc1a8;--brand-ink:#06201b;--hi:#c9a800;--ok:#6ee09a;--bad:#ff9a8f;--okbg:#12361f;--badbg:#3d1b18} 

html{scroll-padding-top:env(safe-area-inset-top,0px)} 

*{box-sizing:border-box} 

body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.55 "Be Vietnam Pro",system-ui,sans-serif} 

button,input,select,textarea{font:inherit;color:inherit} 

button{cursor:pointer} 

:focus-visible{outline:3px solid var(--brand);outline-offset:2px} 

header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:12px clamp(14px,4vw,40px);border-bottom:2px solid var(--ink);background:var(--card)} 

.logo{font-weight:800;font-size:1.35rem;cursor:pointer;background:linear-gradient(transparent 62%,var(--hi) 62%);padding:0 4px} 

nav{display:flex;gap:8px;align-items:center;flex-wrap:wrap} 

.btn{border:1.5px solid var(--ink);background:var(--card);border-radius:8px;padding:7px 14px;font-weight:500} 

.btn.main{background:var(--brand);color:var(--brand-ink);border-color:var(--brand);font-weight:700} 

.btn:disabled{opacity:.5;cursor:not-allowed} 

.chip{font-size:.85rem;padding:3px 10px;border-radius:99px;border:1.5px solid var(--line);background:var(--card)} 

.chip.warn{border-color:var(--bad);color:var(--bad)} 

main{max-width:980px;margin:0 auto;padding:20px clamp(14px,4vw,24px) 60px} 

.tabs{display:flex;gap:6px;margin-bottom:16px} 

.tab{border:0;background:none;padding:8px 14px;font-weight:700;border-bottom:3px solid transparent;color:var(--mute)} 

.tab[aria-selected="true"]{color:var(--ink);border-color:var(--brand)} 

.bar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px} 

.bar input[type=search]{flex:1 1 220px} 

input,select,textarea{background:var(--card);border:1.5px solid var(--line);border-radius:8px;padding:8px 12px;width:100%} 

.bar select{width:auto} 

details.filter{background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:16px} 

summary{font-weight:700;cursor:pointer} 

.group{margin-top:10px}.group b{display:block;font-size:.9rem;color:var(--mute);margin-bottom:4px} 

.tag{display:inline-block;margin:0 6px 6px 0;padding:4px 12px;border-radius:99px;border:1.5px solid var(--line);background:var(--bg);font-size:.9rem} 

.tag[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)} 

.card{background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:12px} 

.card h3{margin:2px 0 6px;font-size:1.05rem} 

.meta{color:var(--mute);font-size:.9rem} 

.row{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap} 

.opt{display:flex;gap:10px;align-items:flex-start;border:1.5px solid var(--line);border-radius:8px;padding:10px 12px;margin:8px 0;cursor:pointer;background:var(--card)} 

.opt input{width:auto;margin-top:5px} 

.opt.sel{border-color:var(--brand)} 

.opt.right{background:var(--okbg);border-color:var(--ok)} 

.opt.wrong{background:var(--badbg);border-color:var(--bad)} 

.why{display:block;margin-top:4px;font-size:.9rem;color:var(--mute)} 

.note{background:var(--okbg);border-left:5px solid var(--ok);padding:10px 14px;border-radius:6px;margin-top:12px} 

.lock{background:var(--badbg);border-left:5px solid var(--bad);padding:10px 14px;border-radius:6px;margin-bottom:12px} 

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px} 

label.f{display:block;font-weight:500;font-size:.9rem;margin:8px 0 3px} 

pre{white-space:pre-wrap;background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:14px;font:inherit;overflow-x:auto} 

.overlay{position:fixed;inset:0;background:rgba(10,20,30,.6);display:none;align-items:center;justify-content:center;padding:16px;z-index:9} 

.overlay.on{display:flex} 

.modal{background:var(--card);border-radius:12px;padding:20px;width:min(400px,100%);border:2px solid var(--ink)} 

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:8px;display:none;z-index:10} 

button.opt{width:100%;text-align:left}.pg{height:8px;background:var(--line);border-radius:9px;overflow:hidden;margin:6px 0 16px}.pg i{display:block;height:100%;background:var(--brand)}.rev{border-left:4px solid var(--bad);padding-left:10px;margin:10px 0} 

footer{text-align:center;color:var(--mute);font-size:.85rem;padding:20px} 

</style> 

</head> 

<body> 

<header> 

  <span class="logo" id="home" tabindex="0" role="link">🎓 SmartTutor</span> 

  <nav id="nav"></nav> 

</header> 

<main id="app"></main> 

<footer>SmartTutor – Giải thích để hiểu bài, không chỉ đưa đáp án. Bản demo giao diện.</footer> 

 

<div class="overlay" id="authBox" role="dialog" aria-modal="true" aria-labelledby="authTitle"> 

  <div class="modal"> 

    <h2 id="authTitle" style="margin:0 0 8px"></h2> 

    <label class="f" for="em">Email</label><input id="em" type="email" autocomplete="email"> 

    <label class="f" for="pw">Mật khẩu (từ 6 ký tự)</label><input id="pw" type="password" autocomplete="current-password">

      <select id="role"><option>Học sinh</option><option>Giáo viên / Trung tâm</option></select></div> 

    <p id="authErr" class="meta" style="color:var(--bad);min-height:1.4em;margin:8px 0"></p> 

    <div class="row"><button class="btn main" id="authGo"></button><button class="btn" id="authX">Đóng</button></div> 

  </div> 

</div>

function toast(m){const t=$("#toast");t.textContent=m;t.style.display="block";setTimeout(()=>t.style.display="none",2600)} 

const DAY=864e5; 

function trial(){if(!st.user)return null;const left=st.user.start+7*DAY-Date.now();return{left,on:left>0,d:Math.floor(left/DAY),h:Math.floor(left%DAY/36e5)}} 

async function hash(s){try{const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}catch(e){return btoa(s)}} 

 

function renderNav(){const t=trial();let h=""; 

 if(st.user){h+=`<span class="chip ${t.on&&t.d<3?'warn':''}">${t.on?`Dùng thử còn ${t.d} ngày ${t.h} giờ`:'Hết hạn dùng thử'}</span><span class="meta">${esc(st.user.email)}</span><button class="btn" id="out">Đăng xuất</button>`} 

 else h+=`<button class="btn" id="li">Đăng nhập</button><button class="btn main" id="rg">Đăng ký</button>`; 

 h+=`<button class="btn" id="th" aria-label="Đổi giao diện sáng tối">🌙</button>`;$("#nav").innerHTML=h; 

 if(st.user)$("#out").onclick=()=>{st.user=null;store.set("st_session",null);render();toast("Đã đăng xuất")}; 

 else{$("#li").onclick=()=>openAuth("login");$("#rg").onclick=()=>openAuth("reg")} 

 $("#th").onclick=()=>{const r=document.documentElement,d=r.dataset.theme==="dark"||(!r.dataset.theme&&matchMedia("(prefers-color-scheme:dark)").matches);r.dataset.theme=d?"light":"dark"}} 

 

function openAuth(m){st.mode=m;$("#authTitle").textContent=m==="reg"?"Đăng ký – dùng thử 7 ngày":"Đăng nhập";$("#authGo").textContent=m==="reg"?"Tạo tài khoản":"Đăng nhập";$("#roleBox").style.display=m==="reg"?"block":"none";$("#authErr").textContent="";$("#authBox").classList.add("on");$("#em").focus()} 

$("#authX").onclick=()=>$("#authBox").classList.remove("on"); 

$("#authGo").onclick=async()=>{const e=$("#em").value.trim().toLowerCase(),p=$("#pw").value,er=$("#authErr"); 

 if(!/^\S+@\S+\.\S+$/.test(e))return er.textContent="Email chưa đúng định dạng."; 

 if(p.length<6)return er.textContent="Mật khẩu cần ít nhất 6 ký tự."; 

 const users=store.get("st_users")||{},hp=await hash(p); 

 if(st.mode==="reg"){if(users[e])return er.textContent="Email này đã đăng ký. Hãy đăng nhập."; 

  users[e]={hp,role:$("#role").value,start:Date.now()};store.set("st_users",users)} 

 else if(!users[e]||users[e].hp!==hp)return er.textContent="Sai email hoặc mật khẩu."; 

 st.user={email:e,role:users[e].role,start:users[e].start};store.set("st_session",e); 

 $("#authBox").classList.remove("on");toast(st.mode==="reg"?"Đã kích hoạt dùng thử 7 ngày":"Chào mừng bạn quay lại");render()}; 

$("#home").onclick=()=>{st.cur=null;st.tab="bai";render()}; 

 

function filtered(){let a=Q.filter(x=>(!st.kw||(x.q+x.s).toLowerCase().includes(st.kw))&&[...st.sel].every(t=>t===x.s||t==="Lớp "+x.g||t===x.l)); 

 const f={new:(a,b)=>b.id-a.id,gu:(a,b)=>a.g-b.g,gd:(a,b)=>b.g-a.g,az:(a,b)=>a.s.localeCompare(b.s,'vi'),za:(a,b)=>b.s.localeCompare(a.s,'vi')}[st.sort];return a.sort(f)} 

 

function viewList(){const tags=[["Lớp",["Lớp 10","Lớp 11","Lớp 12"]],["Môn học",SUBJ]]; 

 const list=filtered(); 

 return `<div class="bar"><select id="so" aria-label="Sắp xếp"><option value="new">Mới nhất</option><option value="gu">Lớp thấp → cao</option><option value="gd">Lớp cao → thấp</option><option value="az">Môn A → Z</option><option value="za">Môn Z → A</option></select> 

 <input type="search" id="kw" placeholder="Tìm câu hỏi hoặc môn học" value="${esc(st.kw)}"></div> 

 <details class="filter" ${st.sel.size?'open':''}><summary>Bộ lọc nâng cao</summary> 

 ${tags.map(([n,ar])=>`<div class="group"><b>${n}</b>${ar.map(t=>`<button class="tag" aria-pressed="${st.sel.has(t)}" data-t="${esc(t)}">${t}</button>`).join("")}</div>`).join("")} 

 <div class="group"><button class="btn" id="clr">Xóa tất cả</button></div></details> 

 <p class="meta">${list.length} câu hỏi</p> 

 ${list.map(x=>`<div class="card"><div class="row"><div><h3>${esc(x.q)}</h3><span class="meta">${x.s} · Lớp ${x.g}</span></div><button class="btn main" data-id="${x.id}">Làm bài</button></div></div>`).join("")||'<div class="card">Không có câu nào khớp. Bỏ bớt bộ lọc để xem thêm.</div>'}`} 

 

function viewDetail(){const x=Q.find(y=>y.id===st.cur),r=st.res,t=trial(); 

 const gate=!st.user?'<div class="lock">Đăng nhập để kiểm tra đáp án và xem lời giải thích.</div>':(!t.on?'<div class="lock">Đã hết 7 ngày dùng thử. Nâng cấp gói để tiếp tục kiểm tra đáp án.</div>':""); 

 return `<button class="btn" id="back">← Danh sách</button><div class="card" style="margin-top:12px"><span class="meta">${x.s} · Lớp ${x.g}</span><h3 style="font-size:1.2rem">${esc(x.q)}</h3> 

 ${x.o.map((o,i)=>`<label class="opt ${st.pick===i?'sel':''} ${r?(i===x.a?'right':st.pick===i?'wrong':''):''}"><input type="radio" name="o" value="${i}" ${st.pick===i?'checked':''} ${r?'disabled':''}><span><b>${"ABCD"[i]}.</b> ${esc(o)}</span></label>`).join("")} 

 ${gate}<button class="btn main" id="chk" ${st.pick===null||r?'disabled':''}>Kiểm tra đáp án</button> 

 ${r?`<div class="note"><b>${st.pick===x.a?'Chính xác!':'Chưa đúng. Đáp án đúng là '+"ABCD"[x.a]+'.'}</b><br>Lời giải: ${esc(x.t)}</div>`:""}</div>`} 

 

function viewGen(){const t=trial(),locked=!st.user||!t.on; 

 return `${locked?`<div class="lock">${!st.user?'Đăng nhập để tạo bài giảng và đề bài tập.':'Đã hết 7 ngày dùng thử. Nâng cấp gói để tạo nội dung mới.'}</div>`:""} 

 <div class="card"><div class="grid"> 

 <div><label class="f" for="gs">Môn học</label><select id="gs">${["Toán","Ngữ văn","Tiếng Anh","Vật lý","Hóa học","Sinh học","Lịch sử","Địa lý"].map(s=>`<option>${s}</option>`).join("")}</select></div> 

 <div><label class="f" for="gg">Lớp</label><select id="gg"><option>10</option><option>11</option><option>12</option></select></div> 

 <div><label class="f" for="gk">Loại nội dung</label><select id="gk"><option value="bg">Dàn ý bài giảng</option><option value="de">Đề bài tập</option></select></div> 

 <div><label class="f" for="gn">Số câu (đề bài tập)</label><input id="gn" type="number" min="4" max="40" value="10"></div></div> 

 <label class="f" for="gt">Chủ đề / mục tiêu</label><input id="gt" placeholder="Ví dụ: Bất phương trình bậc nhất một ẩn"> 

 <p><button class="btn main" id="mk" ${locked?'disabled':''}>Tạo nội dung</button></p></div><div id="out2"></div>`} 

 

function makeText(){const s=$("#gs").value,g=$("#gg").value,t=$("#gt").value.trim()||"(chưa nhập chủ đề)",k=$("#gk").value,n=Math.max(4,+$("#gn").value||10); 

 if(k==="bg")return `DÀN Ý BÀI GIẢNG – ${s} ${g}\nChủ đề: ${t}\n\n1. Mục tiêu bài học\n   - Kiến thức: nêu và hiểu khái niệm chính của "${t}".\n   - Kỹ năng: vận dụng vào bài tập cơ bản và nâng cao.\n2. Kiến thức trọng tâm\n   - Định nghĩa và tính chất.\n   - Công thức / quy tắc cần nhớ.\n   - Lỗi học sinh hay mắc.\n3. Ví dụ minh họa\n   - Ví dụ 1 (nhận biết), Ví dụ 2 (thông hiểu), Ví dụ 3 (vận dụng).\n4. Câu hỏi tương tác trên lớp\n   - 3 câu hỏi nhanh để kiểm tra mức hiểu.\n5. Bài tập củng cố\n   - 5 bài từ dễ đến khó và bài tập về nhà.`; 

 const c=[.4,.3,.2,.1].map(r=>Math.round(n*r));c[0]+=n-c.reduce((a,b)=>a+b,0); 

 return `ĐỀ BÀI TẬP – ${s} ${g}\nChủ đề: ${t}\nTổng số câu: ${n}\n\n`+LV.map((l,i)=>`- ${l}: ${c[i]} câu`).join("\n")+`\n\nCâu 1 → ${n}: mỗi câu có 4 đáp án A, B, C, D, đáp án đúng và lời giải thích.\n(Bản demo chỉ tạo cấu trúc đề. Nội dung câu hỏi sẽ do AI sinh khi nối API.)`} 

 

function render(){renderNav();const a=$("#app"); 

 const tabs=`<div class="tabs" role="tablist"><button class="tab" role="tab" aria-selected="${st.tab==='bai'}" data-tab="bai">Giải bài tập</button><button class="tab" role="tab" aria-selected="${st.tab==='lt'}" data-tab="lt">Luyện tập 15 câu</button><button class="tab" role="tab" aria-selected="${st.tab==='gen'}" data-tab="gen">Tạo bài giảng và đề</button></div>`; 

 a.innerHTML=tabs+(st.tab==="lt"?'<div id="pr"></div>':st.tab==="gen"?viewGen():st.cur?viewDetail():viewList());bind()} 

 

function bind(){const a=$("#app"); 

 a.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{st.tab=b.dataset.tab;st.cur=null;render()}); 

 if(st.tab==="lt"){prRender();return} 

 if(st.tab==="gen"){const m=$("#mk");if(m)m.onclick=()=>{$("#out2").innerHTML=`<pre>${esc(makeText())}</pre>`};return} 

 if(st.cur){$("#back").onclick=()=>{st.cur=null;render()}; 

  a.querySelectorAll("input[name=o]").forEach(i=>i.onchange=()=>{st.pick=+i.value;render()}); 

  $("#chk").onclick=()=>{const t=trial();if(!st.user)return openAuth("login");if(!t.on)return toast("Đã hết thời gian dùng thử");st.res=true;render()};return} 

 $("#so").value=st.sort;$("#so").onchange=e=>{st.sort=e.target.value;render()}; 

 $("#kw").oninput=e=>{st.kw=e.target.value.toLowerCase();const p=e.target.selectionStart;render();const k=$("#kw");k.focus();k.setSelectionRange(p,p)}; 

 a.querySelectorAll(".tag").forEach(b=>b.onclick=()=>{const t=b.dataset.t;st.sel.has(t)?st.sel.delete(t):st.sel.add(t);render()}); 

 $("#clr").onclick=()=>{st.sel.clear();st.kw="";render()}; 

 a.querySelectorAll("[data-id]").forEach(b=>b.onclick=()=>{st.cur=+b.dataset.id;st.pick=null;st.res=null;render();scrollTo(0,0)})} 

 

let P={sub:null,i:0,pick:null,done:false,ans:[]}; 

const prReset=s=>{P={sub:s,i:0,pick:null,done:false,ans:[]}}; 

function prRender(){const a=$("#pr"); 

 if(!P.sub){a.innerHTML=`<p class="meta">Mỗi môn 15 câu trắc nghiệm, có đáp án và lời giải thích sau mỗi câu.</p>`+Object.keys(D).map(k=>`<div class="card row"><div><h3 style="margin:0">${k}</h3><span class="meta">${D[k].length} câu · lớp 10, 11, 12</span></div><button class="btn main" data-s="${k}">Bắt đầu</button></div>`).join(""); 

  a.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{const t=trial();if(!st.user)return openAuth("login");if(!t.on)return toast("Đã hết thời gian dùng thử");prReset(b.dataset.s);prRender()});return} 

 const L=D[P.sub]; 

 if(P.i>=L.length){const ok=P.ans.filter((p,i)=>p===L[i][3]).length; 

  a.innerHTML=`<div class="card"><h3 style="margin-top:0">Hoàn thành môn ${P.sub}</h3><p style="font-size:1.4rem;font-weight:800;margin:0">${ok}/${L.length} câu đúng</p><p class="meta">${ok>=12?"Rất tốt, bạn nắm chắc phần này.":ok>=8?"Khá ổn. Xem lại các câu sai bên dưới.":"Hãy đọc kỹ lời giải các câu sai rồi làm lại."}</p>`+L.map((x,i)=>P.ans[i]===x[3]?"":`<div class="rev"><b>Câu ${i+1}.</b> ${x[1]}<br><span class="meta">Bạn chọn: ${x[2][P.ans[i]]} · Đúng: ${x[2][x[3]]}</span><br>${x[4]}</div>`).join("")+`<div class="row" style="margin-top:14px"><button class="btn main" id="again">Làm lại</button><button class="btn" id="pback">Chọn môn khác</button></div></div>`; 

  $("#again").onclick=()=>{prReset(P.sub);prRender()};$("#pback").onclick=()=>{P.sub=null;prRender()};return} 

 const x=L[P.i]; 

 a.innerHTML=`<div class="row"><b>${P.sub} · Lớp ${x[0]}</b><span class="meta">Câu ${P.i+1}/${L.length}</span></div><div class="pg"><i style="width:${P.i/L.length*100}%"></i></div><div class="card"><p style="font-size:1.1rem;font-weight:500;margin-top:0">${x[1]}</p>`+x[2].map((o,i)=>`<button class="opt ${P.pick===i?'sel':''} ${P.done?(i===x[3]?'right':P.pick===i?'wrong':''):''}" data-o="${i}" ${P.done?'disabled':''}><b>${"ABCD"[i]}.</b><span>${o}</span></button>`).join("")+(P.done?`<div class="note"><b>${P.pick===x[3]?"Chính xác!":"Chưa đúng. Đáp án đúng là "+"ABCD"[x[3]]+"."}</b><br>${x[4]}</div>`:"")+`<div class="row"><button class="btn" id="pback">Thoát</button>${P.done?`<button class="btn main" id="next">${P.i+1===L.length?"Xem kết quả":"Câu tiếp"}</button>`:`<button class="btn main" id="chk" ${P.pick===null?'disabled':''}>Kiểm tra đáp án</button>`}</div></div>`; 

 $("#pback").onclick=()=>{P.sub=null;prRender()}; 

 a.querySelectorAll("[data-o]").forEach(b=>b.onclick=()=>{P.pick=+b.dataset.o;prRender()}); 

 const c=$("#chk");if(c)c.onclick=()=>{if(!st.user)return openAuth("login");if(!trial().on)return toast("Đã hết thời gian dùng thử");P.done=true;P.ans[P.i]=P.pick;prRender()}; 

 const n=$("#next");if(n)n.onclick=()=>{P.i++;P.pick=null;P.done=false;prRender();scrollTo(0,0)}} 

 

(function init(){const e=store.get("st_session"),u=store.get("st_users");if(e&&u&&u[e])st.user={email:e,role:u[e].role,start:u[e].start};render()})(); 

</script> 

</body> 

</html>
